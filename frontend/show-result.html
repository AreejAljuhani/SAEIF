<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saeif - Show Result</title>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/show-result.css" />

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>

<body>
  <div class="container">
    
    <!-- Main Navigation Sidebar -->
    <aside class="sidebar">
      <!-- Logo -->
      <div class="logo">
        <img src="assets/saeif-logo1.png" alt="Saeif Logo" class="logo-img">
      </div>

      <nav class="sidebar-nav">
        <a href="home.html" class="nav-item">
          <i class="fas fa-home nav-icon"></i>
          <span class="nav-text">Home</span>
        </a>

        <a href="patient-registration.html" class="nav-item active">
          <i class="fas fa-folder-open nav-icon"></i>
          <span class="nav-text">Emergency Triage</span>
        </a>

        <a href="patient-list.html" class="nav-item">
          <i class="fas fa-file-alt nav-icon"></i>
          <span class="nav-text">ED Patient Board</span>
        </a>

        <a href="iot-monitoring.html" class="nav-item">
          <i class="fas fa-heartbeat nav-icon"></i>
          <span class="nav-text">Vital Signs Monitoring</span>
        </a>

        <a href="alerts.html" class="nav-item">
          <i class="fas fa-bell nav-icon"></i>
          <span class="nav-text">Clinical Alerts</span>
        </a>
      </nav>

      <!-- Map Icon -->
      <div class="sidebar-footer">
        <img src="assets/map-icon.png" alt="World map" class="sidebar-map">
      </div>
    </aside>


    <!-- Main Content -->
    <main class="main-content">
      <section class="panel show-result-panel">
       <!-- Success Icon -->
        <div class="success-icon">
          <i class="fa-solid fa-check"></i>
        </div>

        <!-- Page Title -->
        <h1 class="title">Classification completed successfully</h1>
        <p class="subtitle">Patient: <span class="patient-name" id="patientName">Loading...</span></p>

        <!-- Patient Info Summary -->
        <div class="patient-info-summary" id="patientInfo" style="display: none;">
          <div class="info-row">
            <span class="label">Age:</span>
            <span class="value" id="displayAge">--</span>
          </div>
          <div class="info-row">
            <span class="label">Gender:</span>
            <span class="value" id="displayGender">--</span>
          </div>
          <div class="info-row">
            <span class="label">Arrival Mode:</span>
            <span class="value" id="displayArrivalMode">--</span>
          </div>
        </div>

        <!-- CTAS Result Card -->
        <div class="ctas-card" id="ctasCard">
          <div class="ctas-label">CTAS Level</div>
          <div class="ctas-number" id="ctasLevel">--</div>
          <div class="ctas-desc" id="ctasDescription">Loading prediction...</div>
        </div>

        <!-- Confidence Score -->
        <div class="confidence-box" id="confidenceBox" style="display: none;">
          <div class="confidence-label">Model Confidence</div>
          <div class="confidence-value" id="confidenceValue">--</div>
        </div>

        <!-- Expected waiting time -->
        <div class="waiting-box">
          <div class="waiting-left">
            <i class="fa-regular fa-clock"></i>
            <span>Expected waiting time</span>
          </div>
          <div class="waiting-right" id="waitingTime">Loading...</div>
        </div>

        <!-- Action Buttons -->
        <div class="actions">
          <button class="btn primary" id="confirmBtn" style="display: block !important;">Confirm Result</button>
          <a href="patient-reclassification.html" class="btn secondary">Override Result</a>
          <!-- IoT Monitoring Button - Created dynamically by JavaScript -->
        </div>
      </section>
    </main>
  </div>

  <!-- JavaScript -->
   <!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

<!-- config FIRST -->
<script src="js/firebase-config.js"></script>

<!-- your logic AFTER firebase -->
<script src="js/show-result.js"></script>
</body>

</html>
