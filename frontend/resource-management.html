<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="required-role" content="admin">

<title>Saeif — Resource Management</title>

<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/resource-management.css">
</head>

<body>

<style>
body { visibility: visible !important; }
</style>

<div class="container">

  <aside class="sidebar">
    <div class="logo">
      <img src="assets/saeif-logo1.png" class="logo-img"
        onerror="this.style.display='none'; document.querySelector('.logo-fallback').style.display='block'">
      <div class="logo-fallback" style="display:none;">Saeif</div>
    </div>
<nav class="sidebar-nav">
  <a href="admin-dashboard.html" class="nav-item">
    <i class="fas fa-chart-line nav-icon"></i>
    <span class="nav-text">Dashboard</span>
  </a>
  <a href="user-management.html" class="nav-item active">
    <i class="fas fa-users-cog nav-icon"></i>
    <span class="nav-text">User Management</span>
  </a>
  <a href="resource-management.html" class="nav-item">
  <i class="fas fa-sliders-h nav-icon"></i>
  <span class="nav-text">Resources</span>
</a>
  <a href="crowding-fellow.html" class="nav-item">
    <i class="fas fa-hospital nav-icon"></i>
    <span class="nav-text">Crowding Fellow</span>
  </a>
  <a href="admin-alerts.html" class="nav-item">
    <i class="fas fa-bell nav-icon"></i>
    <span class="nav-text">Alerts</span>
  </a>
</nav>

<div class="sidebar-footer">
  <div class="admin-info">
    <div class="admin-avatar"><i class="fas fa-user-shield"></i></div>
    <div class="admin-details">
      <span class="admin-name" id="currentUserName">Admin</span>
      <span class="admin-role">Administrator</span>
    </div>
  </div>
  <button class="signout-btn" onclick="signOut()">
    <i class="fas fa-sign-out-alt"></i>
  </button>
</div>
  </aside>

  <!-- MAIN -->
  <main class="main-content">

    <section class="patient-stats-section">

      <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-user-md"></i></div>
        <div class="stat-number" id="doctorsCount">0</div>
        <div class="stat-label">Doctors Available</div>
      </div>

      <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-procedures"></i></div>
        <div class="stat-number" id="bedsCount">0</div>
        <div class="stat-label">Beds Available</div>
      </div>

    </section>

    <section class="emergency-overview">

      <div class="um-header">
        <h2 class="section-title">Resource Control</h2>
      </div>

      <div class="resource-form">
        <div class="form-group">
          <label for="doctorsInput">Doctors</label>
          <input type="number" id="doctorsInput" min="0" placeholder="0">
        </div>

        <div class="form-group">
          <label for="bedsInput">Beds</label>
          <input type="number" id="bedsInput" min="0" placeholder="0">
        </div>
      </div>

      <div class="resource-actions">
        <button onclick="updateDoctors()">Update Doctors</button>
        <button onclick="updateBeds()">Update Beds</button>
      </div>

    </section>

  </main>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script src="js/firebase-config.js"></script>
<script src="js/resource-management.js"></script>

</body>
</html>
